name: Check published website
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public pages and local assets
        shell: python
        run: |
          import json, urllib.request
          base = 'https://xwjdream.github.io/gensokyo-sketchbook-pages/'
          checks = [('', 'text/html', 'GitHub 浏览版'), ('gallery.js?v=cast44', None, '完整版画廊'), ('characters.js?v=cast44', None, "artwork:'yuki-v2'"), ('assets/yuki-v2.png', 'image/png', None), ('scenes-data.js?v=cast44', None, "id:'houso-pinegate'"), ('assets/scene-houso-pinegate.webp', 'image/webp', None), ('assets/sara.png', 'image/png', None), ('world.js?v=cast44', None, "houso:{place:"), ('explore.js?v=cast44', None, 'trail-listening'), ('lore-data.js?v=cast44', None, "id:'mountain-paths'"), ('assets/mai-pc98.png', 'image/png', None), ('app.js?v=cast44', None, '原作造型对照'), ('assets/houso.png', 'image/png', None), ('assets/reimu.webp', 'image/webp', None), ('assets/atlas-mountain.webp', 'image/webp', None), ('reading-layout.js?v=cast44', None, '继续展开'), ('reading-layout.css?v=cast44', None, 'object-fit:contain'), ('index.html?edition=44', 'text/html', 'hero-paths'), ('scenes.js?v=cast44', None, 'scene-region'), ('explore.js?v=cast44', None, 'trail-directory-link'), ('atlas.js?v=cast44', None, 'atlas-reading-link'), ('characters.js?v=cast44', None, "id:'previous-miko'"), ('scenes-data.js?v=cast44', None, "id:'dragon-square'"), ('world.js?v=cast44', None, "id:'steam-effigy'"), ('assets/scene-dragon-square.png', 'image/png', None), ('characters.js?v=cast44', None, "id:'laika'"), ('scenes-data.js?v=cast44', None, "id:'moon-gatewatch'"), ('world.js?v=cast44', None, "id:'fuji-vessel'"), ('assets/scene-moon-gatewatch.png', 'image/png', None), ('characters.js?v=cast44', None, "id:'chokuboro'"), ('scenes-data.js?v=cast44', None, "id:'cup-afterhours'"), ('world.js?v=cast44', None, "id:'tavern-and-cup'"), ('assets/scene-cup-afterhours.png', 'image/png', None), ('lore.js?v=cast44', None, 'lore-directory-current'), ('lore-data.js?v=cast44', None, "id:'borrowed-moon'"), ('world.js?v=cast44', None, "id:'two-newsrooms'"), ('reading-layout.js?v=cast44', None, 'compactSize'), ('characters.js?v=cast44', None, "id:'ibaraki-arm'"), ('scenes-data.js?v=cast44', None, "id:'dream-battery'"), ('world.js?v=cast44', None, "id:'rika-machines'"), ('assets/scene-dream-battery.png', 'image/png', None), ('characters.js?v=cast44', None, "id:'hungry-villager'"), ('scenes-data.js?v=cast44', None, "id:'dormouse-snow'"), ('world.js?v=cast44', None, "id:'ennichi-and-snow'"), ('assets/scene-dormouse-snow.png', 'image/png', None), ('characters.js?v=cast44', None, "id:'letter-spirit'"), ('scenes-data.js?v=cast44', None, "id:'dragon-scroll'"), ('world.js?v=cast44', None, "id:'letters-and-supper'"), ('assets/scene-dragon-scroll.png', 'image/png', None), ('characters.js?v=cast44', None, "id:'fox-student'"), ('scenes-data.js?v=cast44', None, "id:'suzunaan-bookbox'"), ('world.js?v=cast44', None, "id:'suzunaan-clues'"), ('assets/scene-melon-shadow.png', 'image/png', None), ('characters.js?v=cast44', None, "id:'kanda'"), ('scenes-data.js?v=cast44', None, "id:'kanda-zelkova'"), ('world.js?v=cast44', None, "id:'flying-home'"), ('assets/scene-kanda-zelkova.png', 'image/png', None)]
          with urllib.request.urlopen(base + 'pages-artwork.json', timeout=40) as response:
              artwork = json.load(response)
          external = set(artwork['external'])
          for path, content_type, expected in checks:
              original = path.removeprefix('assets/')
              url = artwork['rawBase'] + original if original in external else base + path
              with urllib.request.urlopen(url, timeout=40) as response:
                  body = response.read()
                  assert response.status == 200, (path, response.status)
                  if content_type:
                      assert content_type in response.headers.get('Content-Type', ''), path
                  if expected:
                      assert expected in body.decode('utf-8'), path
                  assert len(body) > 0, path
                  print(f'HTTP 200: {path or "index.html"} ({len(body)} bytes)')
